[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=external_api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=50
    --asyncio-mode=auto

# Test markers
markers =
    unit: Unit tests for isolated components
    integration: Integration tests for component interaction
    performance: Performance and benchmarking tests
    mock_cli: Tests that use mock CLI interfaces
    slow: Tests that take longer to run
    distributed: Distributed system tests
    mutation: Mutation testing suite
    reporting: Reporting-related tests

# Test logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Async test support  
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = external_api
omit = 
    */__init__.py
    */tests/*
    */testing/*
    .claude/config/config.yaml
    external_api/integration_test.py
    external_api/database_models.py
    external_api/rbac_endpoints.py
    external_api/rbac_endpoints_simple.py
    external_api/redis_cache_integration.py
    external_api/trace_utils.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError